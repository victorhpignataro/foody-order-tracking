name: foody
services:
  rabbitmq:
    container_name: rabbit-foody
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
  redis:
    container_name: redis-foody
    image: redis:8.10
    ports:
      - "6379:6379"
